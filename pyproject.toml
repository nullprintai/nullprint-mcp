[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nullprint-mcp"
version = "0.1.0"
description = "MCP server for Nullprint, the multi-profile browser: create, launch, check and drive browser profiles from any MCP-capable AI agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nullprint", email = "support@nullprint.ai" }]
keywords = ["mcp", "model-context-protocol", "browser", "fingerprint", "nullprint", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = ["mcp>=1.27,<2", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://nullprint.ai"
Documentation = "https://nullprint.ai/docs/mcp/"
Source = "https://github.com/nullprintai/nullprint-mcp"

[project.scripts]
nullprint-mcp = "nullprint_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["nullprint_mcp"]

[tool.hatch.build.targets.sdist]
include = ["nullprint_mcp/**", "tests/**", "README.md", "LICENSE", "pyproject.toml"]
